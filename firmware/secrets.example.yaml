# Copy to secrets.yaml (ESPHome Builder already has one) and fill in.
wifi_ssid: "YourIoTNetwork"
wifi_password: "your-wifi-password"
# Generate a key with: openssl rand -base64 32   (or let the ESPHome wizard create one).
# Also encrypts OTA uploads, so no separate OTA password is needed.
geo_trio_api_key: "base64-32-byte-key-here="
geo_trio_fallback_password: "at-least-8-characters"
# Login for the tap's local web page (user: admin)
geo_trio_web_password: "choose-a-password"
