binary_sensor:
  # Supply status from the meters (0x0702 attr 0x0014): on = supply connected / gas valve open
  - { platform: template, id: elec_supply, name: "Electricity supply", device_class: power }
  - { platform: template, id: gas_supply, name: "Gas supply", icon: "mdi:valve" }
  # On if no electricity reading has arrived for 5 minutes (loose wire, IHD crashed or lost the meter)
  - platform: template
    id: electricity_data_stale
    name: "Electricity data stale"
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      uint32_t last = id(g_last_reading_ms);
      if (last == 0) return millis() > 300000;          // nothing at all since boot, 5 min grace
      return (millis() - last) > 300000;
  # On if the newest gas half-hour sample ended over 65 minutes ago (normally 1-31 min; 65 = two missed in a
  # row). Uses the half hour's own end time, not its arrival, so a hub re-sending an old half hour (gas meter
  # gone quiet: flat battery, out of range) still counts as stale. Also covers a loose wire, the IHD crashing
  # or losing the comms hub. After boot: on if no sample at all within 65 minutes.
  - platform: template
    id: gas_data_stale
    name: "Gas data stale"
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      const uint32_t limit_s = 65 * 60;
      uint32_t end = id(g_gas_sample_end);
      auto nowt = id(ha_time).now();
      if (end == 0 || !nowt.is_valid()) return millis() > limit_s * 1000UL && end == 0;
      return nowt.timestamp - (time_t(end) + 946684800) > limit_s;

